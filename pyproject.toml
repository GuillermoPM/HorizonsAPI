[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizonsapi"
version = "0.1.0"
description = "Download data from the NASA JPL Horizons API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "requests",
]

[project.scripts]
horizons = "horizonsapi.main:main"